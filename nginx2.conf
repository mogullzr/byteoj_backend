user  root;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    server_tokens off;
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    # 开启 gzip
    gzip on;
    # 开启 gzip_static。开启后可能会报错，需要安装相应的 gzip 压缩模块。只有开启 gzip_static，前端打包的 .gz 文件才会有效果
    gzip_static on;

    # 用于控制哪些响应需要进行 gzip 压缩
    gzip_proxied any;
    gzip_min_length 1k;
    # 设置用于压缩响应的内存缓冲区的大小和数量
    gzip_buffers 4 16k;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary off;
    gzip_disable "MSIE [1-6]\.";



    server {
		listen 80;
		server_name 192.168.137.54;

		ssl_session_timeout 5m;
		charset utf-8;
		root /usr/share/nginx/html/byteoj/dist;
		location / {
			try_files $uri $uri/ /index.html;
            		if ($http_user_agent ~* (Python|Curl)) {
                	return 403;
            	    }
		}
		location /api {
			proxy_pass http://byteoj:7092;
			proxy_http_version 1.1;
			proxy_cache off;
			proxy_buffering off;
			chunked_transfer_encoding on;
			tcp_nopush on;
			tcp_nodelay on;
			keepalive_timeout 300;
			client_max_body_size 200m;
			client_body_buffer_size 800M;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			
			# 🔥 添加 WebSocket 超时配置（防止长连接被断开）
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_connect_timeout 60s;
			
			if ($http_user_agent ~* (Python|Curl|wget|scrapy)) {
				return 403;
			}

            # 检查Referer头是否包含 https://www.byteoj.cn
            # if ($http_referer !~* https://www\.byteoj\.com) {
            #    return 403;
            #}

			# limit_req zone=rate_limit burst=10 nodelay;
			limit_req_status 429;
		}
    }

    server {
		listen 10000;
		server_name 192.168.137.54;

		ssl_session_timeout 5m;
		charset utf-8;
		root /usr/share/nginx/html/byteojAdmin/dist;
		location / {
			try_files $uri $uri/ /index.html;
            		if ($http_user_agent ~* (Python|Curl)) {
                	return 403;
            	    }
		}
		location /api {
			proxy_pass http://byteoj:7092;
			proxy_http_version 1.1;
			proxy_cache off;
			proxy_buffering off;
			chunked_transfer_encoding on;
			tcp_nopush on;
			tcp_nodelay on;
			keepalive_timeout 300;
			client_max_body_size 200m;
			client_body_buffer_size 800M;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			
			# 🔥 添加 WebSocket 超时配置（防止长连接被断开）
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_connect_timeout 60s;
			
			if ($http_user_agent ~* (Python|Curl|wget|scrapy)) {
				return 403;
			}

            # 检查Referer头是否包含 https://admin.byteoj.cn
            # if ($http_referer !~* https://admin\.byteoj\.com) {
            #   return 403;
            #}

			# limit_req zone=rate_limit burst=10 nodelay;
			limit_req_status 429;
		}
    }
}