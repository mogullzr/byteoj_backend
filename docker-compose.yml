version: "2.29.2"

services:
  mysql:
    image: mysql:8.0.33
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "xxxxxxxxxxx" # MySQL的密码
    volumes:
      - "/root/opt/mysql/conf:/etc/mysql/conf.d"
      - "/root/opt/mysql/logs:/var/log/mysql"
      - "/root/opt/mysql/data:/root/opt/mysql/data"
    networks:
      - byteoj
    restart: always
  postgres:
    image: pgvector/pgvector:pg16  # 使用官方预装 pgvector 的镜像
    container_name: postgres # pg的运行容器名称
    ports:
      - "5432:5432"
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_DB: "postgres" # 你的pg数据表,自己可以自己设
      POSTGRES_USER: "postgres" # 你的pg用户名，自己可以自己设
      POSTGRES_PASSWORD: "xxxxxxxxxxxx" # 你的pg密码，自己可以自己设
    volumes:
      # 建议更换一个目录名，以免和标准 postgres 镜像的数据格式冲突
      - "/root/opt/pgvector/data:/root/opt/pgvector/data"
      - "/root/opt/pgvector/logs:/root/opt/pgvector/logs"
    networks:
      - byteoj
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ 服务
  rabbitmq:
    image: rabbitmq:3.12.1-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"      # AMQP 端口
      - "15672:15672"    # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: "xxxxx" # 用户名，自己可以自己设
      RABBITMQ_DEFAULT_PASS: "xxxxxxxxxx" # rabbitmq的密码，自己可以自己设
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: "byteoj_secret_cookie"
    volumes:
      - "/root/opt/rabbitmq/data:/var/lib/rabbitmq"
      - "/root/opt/rabbitmq/logs:/var/log/rabbitmq"
    networks:
      - byteoj
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:5.0.14
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "/root/opt/redis/data:/data"
    restart: always
    command: redis-server --requirepass "xxxxxxxxxxx" # 这里写的是redis密码，，自己可以自己设
    privileged: true
    networks:
      - byteoj

  byteoj:
    build:
      context: "/xx/xx/xx" # 后端代码在linux上的目录，可以自己设
      dockerfile: Dockerfile
    container_name: "byteoj" # 对应后端服务的容器名称
    ports:
      - "7091:7091"
    volumes:
      - "/root/opt/mysql/data/backup:/root/opt/mysql/data/backup"
    networks:
      - byteoj
    depends_on:
      - mysql
      - rabbitmq
      - redis
    restart: always
    environment:
      # 数据库配置（已添加 allowPublicKeyRetrieval=true）
      SPRING_PROFILES_ACTIVE: dev
      # RabbitMQ 配置
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: "xxxxxxxxxxxxx"
      SPRING_RABBITMQ_PASSWORD: "xxxxxxxxxxxxx"
      SPRING_RABBITMQ_VIRTUAL_HOST: /

  nginx:
    image: nginx:1.28.3
    container_name: nginx
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UFT-8
      - LANGUAGE=C.UTF-8
    ports:
      - "80:80"
      - "443:443"
      - "10002:10002"
    volumes:
      - "/root/www/wwwroot/byteoj/dist:/usr/share/nginx/html/byteoj/dist"
      - "/root/www/wwwroot/byteojAdmin/dist:/usr/share/nginx/html/byteojAdmin/dist"
      - "/root/www/wwwroot/XBT/dist:/usr/share/nginx/html/XBT/dist"
      - "/root/ssl:/root/ssl"
      - "/root/opt/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "/root/www/wwwroot/index/dist:/usr/share/nginx/html/index/dist"
    networks:
      - byteoj
    depends_on:
      - byteoj
    restart: always

networks:
  byteoj:
    name: byteoj
    driver: bridge