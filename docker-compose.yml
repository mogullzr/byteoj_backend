version: "2.29.2"

services:
  mysql:
    image: mysql:8.0.33
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "142398749lzr"
    volumes:
      - "/root/opt/mysql/conf:/etc/mysql/conf.d"
      - "/root/opt/mysql/logs:/var/log/mysql"
      - "/root/opt/mysql/data:/root/opt/mysql/data"
    networks:
      - byteoj
    restart: always
  postgres:
    image: pgvector/pgvector:pg16  # 使用官方预装 pgvector 的镜像
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "3hwTJ7Rd2Zawm5hcEutdBRKGncNkExbW"
    volumes:
      # 建议更换一个目录名，以免和标准 postgres 镜像的数据格式冲突
      - "/root/opt/pgvector/data:/var/lib/postgresql/data"
      - "/root/opt/pgvector/logs:/var/log/postgresql"
    networks:
      - byteoj
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # RabbitMQ 服务
  rabbitmq:
    image: rabbitmq:3.12.1-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"      # AMQP 端口
      - "15672:15672"    # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: "Mogullzr"
      RABBITMQ_DEFAULT_PASS: "zpDhDEkKAzkVBCZD35Qm"
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: "byteoj_secret_cookie"
    volumes:
      - "/root/opt/rabbitmq/data:/var/lib/rabbitmq"
      - "/root/opt/rabbitmq/logs:/var/log/rabbitmq"
    networks:
      - byteoj
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:5.0.14
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "/root/opt/redis/data:/data"
    restart: always
    command: redis-server --requirepass "Redis的密码"
    privileged: true
    networks:
      - byteoj

  byteoj:
    build:
      context: /root/opt
      dockerfile: Dockerfile
    container_name: byteoj
    ports:
      - "7091:7091"
    volumes:
      - "/root/opt/mysql/data/backup:/root/opt/mysql/data/backup"
    networks:
      - byteoj
    depends_on:
      - mysql
      - postgres
      - rabbitmq
      - redis
    restart: always
    environment:
      # 数据库配置（已添加 allowPublicKeyRetrieval=true）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/byteoj?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      # RabbitMQ 配置（密码已修复为与服务器一致）
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: "RabbitMQ账号"
      SPRING_RABBITMQ_PASSWORD: "RabbitMQ密码"
      SPRING_RABBITMQ_VIRTUAL_HOST: /

  nginx:
    image: nginx
    container_name: nginx
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UFT-8
      - LANGUAGE=C.UTF-8
    ports:
      - "80:80"
      - "443:443"
      - "10002:10002"
    volumes:
      - "/root/www/wwwroot/byteoj/dist:/usr/share/nginx/html/byteoj/dist"
      - "/root/www/wwwroot/byteojAdmin/dist:/usr/share/nginx/html/byteojAdmin/dist"
      - "/root/www/wwwroot/XBT/dist:/usr/share/nginx/html/XBT/dist"
      - "/root/ssl:/root/ssl"
      - "/root/opt/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "/root/www/wwwroot/index/dist:/usr/share/nginx/html/index/dist"
    networks:
      - byteoj
    depends_on:
      - byteoj
    restart: always

networks:
  byteoj:
    name: byteoj
    driver: bridge