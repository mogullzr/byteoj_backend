user  root;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    add_header X-Frame-Options SAMEORIGIN;
    server_tokens off;
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    # 开启 gzip
    gzip on;
    # 开启 gzip_static。开启后可能会报错，需要安装相应的 gzip 压缩模块。只有开启 gzip_static，前端打包的 .gz 文件才会有效果
    gzip_static on;

    # 用于控制哪些响应需要进行 gzip 压缩
    gzip_proxied any;
    gzip_min_length 1k;
    # 设置用于压缩响应的内存缓冲区的大小和数量
    gzip_buffers 4 16k;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary off;
    gzip_disable "MSIE [1-6]\.";

    server {
        listen 80;
        server_name www.byteoj.com;
        charset utf-8;
        return 301 https://$host$request_uri;
    }
    server {
        listen 80;
        server_name paper.byteoj.com;
        charset utf-8;
        return 301 https://$host$request_uri;
    }
    server {
        listen 80;
        server_name xbt.byteoj.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name admin.byteoj.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name paperadmin.byteoj.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 80;
        server_name repeat.byteoj.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name xbt.byteoj.com;

        # SSL 证书路径（需替换为实际路径）
        ssl_certificate /root/ssl/XBT/xbt.byteoj.com.pem;
        ssl_certificate_key /root/ssl/XBT/xbt.byteoj.com.key;

         # 可选的 SSL 配置优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
         # 静态文件根目录（需替换为你的实际路径）
        location / {
            root /usr/share/nginx/html/XBT/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; # 支持 SPA（单页应用），可选
        }
        location /api {
            proxy_pass http://101.43.48.120:3030;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            fastcgi_buffers 256 128k;
            chunked_transfer_encoding off;
            # python没有处理跨域问题，这里反代处理, 添加 CORS 头
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Token,Version' always;

            # 处理 OPTIONS 预检请求
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Token,Version' always;
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }

    server {
		listen 443 ssl;
		server_name byteoj.com;

		ssl_session_timeout 5m;
		charset utf-8;
		root /usr/share/nginx/html/byteoj/dist;
		location / {
			try_files $uri $uri/ /index.html;
            		if ($http_user_agent ~* (Python|Curl)) {
                	return 403;
            	    }
		}
		location /api {
			proxy_pass http://byteoj:7091;
			proxy_http_version 1.1;
			proxy_cache off;
			proxy_buffering off;
			chunked_transfer_encoding on;
			tcp_nopush on;
			tcp_nodelay on;
			keepalive_timeout 300;
			client_max_body_size 200m;
			client_body_buffer_size 800M;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			if ($http_user_agent ~* (Python|Curl|wget|scrapy)) {
				return 403;
			}

            # 检查Referer头是否包含 https://www.byteoj.cn
            if ($http_referer !~* https://www\.byteoj\.com) {
                return 403;
            }

			# limit_req zone=rate_limit burst=10 nodelay;
			limit_req_status 429;
		}
    }
