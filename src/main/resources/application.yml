spring:
  jpa:
    hibernate:
      ddl-auto: update  # 测试用create-drop，生产update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
  mail:
    host: smtp.qq.com # 指定邮件服务器的主机名，这里默认是smtp.qq.com，表示使用的是腾讯的SMTP服务器。
    port: 465 # 587也行，但是就不需要开放ssl的enable了，同时修改protocol协议为 smtps 才行
    username: ${hm.mail.username} # 用户名 xxxxxxxx@qq.com
    password: ${hm.mail.password}  # 这里就是我前面提到的授权码了
    properties: # 其他配置
      mail:
        smtp:
          ssl:
            enable: true
          socketFactoryClass: javax.net.ssl.SSLSocketFactory # 指定SSL Socket工厂类，用于创建加密的邮件连接。
          auto: true # 设置为true表示启用自动连接。
        starttls: # 配置STARTTLS加密连接
          enable: true # 设置为true表示启用STARTTLS。
          required: true # 设置为true表示STARTTLS是必需的，如果不可用，则会抛出异常。
    default-encoding: UTF-8 # 设置邮件内容的默认编码格式为UTF-8 默认就是UTF-8
    protocol: smtps
  main:
    # 解决升级Spring Boot2.6后,因依赖循环引用导致启动时报错的问题
    allow-circular-references: true
  profiles:
    active: prod
    name: backend
  datasource:
    dynamic:
      # 1. 设置默认数据源：保持原有逻辑，默认走 mysql
      primary: mysql
      # 2. 严格模式：如果指定了不存在的數據源是否报错
      strict: false
      datasource:
        # ================= MySQL 配置 (原有逻辑迁移) =================
        mysql:
          # 注意：dynamic-datasource 不需要在这里写 driver-class-name，它会自动识别 url
          driver-class-name: com.mysql.cj.jdbc.Driver # 驱动
          url: jdbc:mysql://${hm.db.host}:${hm.db.port}/${hm.db.table}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai # 地址
          username: ${hm.db.name} # 用户名
          password: ${hm.db.pwd} # 密码
          # HikariCP 连接池优化配置 (保留你原有的调优参数)
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
        # ================= PostgreSQL 配置 (新增) =================
        pg:
          # PostgreSQL 驱动
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${hm.pg.host}:${hm.pg.port}/${hm.pg.db}
          username: ${hm.pg.user} # 用户名
          password: ${hm.pg.pwd} # 密码
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
    async:
      request-timeout: 10000000
  # redis配置
  redis:
    # 端口
    port: ${hm.redis.port}
    host: ${hm.redis.host}
    # 使用的数据库索引，默认是0
    database: 0
    # 连接超时时间
    timeout: 1800000
    # 设置密码
    password: ${hm.redis.pwd}
    lettuce :
      pool:
        # 最大阻塞等待时间，负数表示没有限制
        max-wait: -1
        # 连接池中的最大空闲连接
        max-idle: 5
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中最大连接数，负数表示没有限制
        max-active: 20

  # RabbitMQ 配置
  rabbitmq:
    host: ${hm.rabbitmq.host}
    port: 5672
    username: ${hm.rabbitmq.username}
    password: ${hm.rabbitmq.password}
    virtual-host: /
    # 开启消息发送确认
    publisher-returns: true
    publisher-confirm-type: correlated  # 确认发送
    template:
      mandatory: true
    cache:
      channel:
        checkout-timeout: 10s  # 通道池
        size: 50  # 通道数
    listener:
      simple:
        concurrency: 2  # 起步 2 线程（判题是CPU密集型，不能太多）
        max-concurrency: 4  # 峰值 4（避免CPU过载）
        prefetch: 1  # 预取 1 条/线程（确保负载均衡）
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 5  # 重试 5 次
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 30000ms
          listen-attempts: 3
        missing-queues-fatal: false  # 容错
      template:
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
    # 超时设置
    connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  # 端口
  port: 7091
  address: 0.0.0.0
  # 自定义路径
  servlet:
    context-path: /api
#    session:
#      cookie:
#        domain: localhost
sandbox:
  urls: ${sandbox.urls}
algorithm-test-generation:
  enabled: true
  max-retries: 3
  queued-recovery-timeout-seconds: 60
  recovery-interval-seconds: 30
  max-scales-per-job: 5
  max-cases-per-scale: 1000
  max-cases-per-job: 3000
  generator:
    batch-size: 25
    debug-max-count: 10
    cpu-limit-seconds: 30
    memory-limit-mb: 1024
    stdout-max-bytes-per-batch: 33554432
  reference:
    batch-size: 25
    cpu-limit-seconds: 30
    memory-limit-mb: 2048
  limits:
    max-input-bytes-per-case: 8388608
    max-output-bytes-per-case: 8388608
    max-input-bytes-per-job: 1073741824
    max-output-bytes-per-job: 1073741824
  ai:
    response-timeout-seconds: 180
    max-response-bytes: 1048576
  sandbox:
    response-timeout-seconds: 300
mybatis-plus:
  configuration:
    #    会默认将下滑线转换成驼峰式
    map-underscore-to-camel-case: false
    log-impl: ${hm.log} # 日志是否显示
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
aliyun:
  oss:
    endpoint: ${hm.aliyun.oss.endpoint} # 阿里云OSS地址，这里看你自己的OSS选择
    accessKeyId: ${hm.aliyun.oss.accessKeyId} # 阿里云OSS账号
    accessKeySecret: ${hm.aliyun.oss.accessKeySecret} # 阿里云OSS密钥
    # bucket可以由控制台创建，也可以使用java代码创建
    bucketName: ${hm.aliyun.oss.bucketName} #阿里云OSS上的存储块bucket名字
  vod:
    endpoint: ${${hm.aliyun.vod.endpoint}
    accessKeyId: ${hm.aliyun.vod.accessKeyId} # 阿里云vod的OSS账号
    accessKeySecret: ${hm.aliyun.vod.accessKeySecret} # 阿里云void的OSS密钥
  embedding:
    url: ${hm.aliyun.embedding.url}
    acccessKeyId: ${hm.aliyun.embedding.accessKeyId}

interfaceAccess:
